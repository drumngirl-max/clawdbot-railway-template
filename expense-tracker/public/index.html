<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17212b" />
    <title>Учёт расходов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="summary">
        <div class="summary-card">
          <span class="summary-label">Сегодня</span>
          <span class="summary-value" id="totalToday">—</span>
        </div>
        <div class="summary-card">
          <span class="summary-label">За месяц</span>
          <span class="summary-value" id="totalMonth">—</span>
        </div>
      </header>

      <section class="chart" id="chartSection" hidden>
        <h2 class="section-title">Расходы за месяц по категориям</h2>
        <div class="bars" id="bars"></div>
      </section>

      <section class="add">
        <h2 class="section-title">Новый расход</h2>
        <form id="addForm" class="form" autocomplete="off">
          <div class="row">
            <input
              id="amount"
              class="input amount-input"
              type="number"
              inputmode="decimal"
              step="0.01"
              min="0"
              placeholder="Сумма"
              required
            />
            <span class="currency" id="currencyLabel"></span>
          </div>
          <select id="category" class="input"></select>
          <input id="note" class="input" type="text" maxlength="200" placeholder="Комментарий (необязательно)" />
          <input id="date" class="input" type="date" />
          <button type="submit" class="btn-primary" id="submitBtn">Добавить</button>
        </form>
      </section>

      <section class="list">
        <h2 class="section-title">История</h2>
        <div id="expenses" class="expenses"></div>
        <p id="empty" class="empty" hidden>Пока нет записей. Добавьте первый расход выше.</p>
      </section>
    </main>

    <div id="toast" class="toast" hidden></div>

    <script src="./app.js"></script>
  </body>
</html>
